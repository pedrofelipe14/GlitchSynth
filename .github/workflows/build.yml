name: Build

# Every push builds the plugin on Windows. Pushing a tag like v0.3.0 also publishes a
# GitHub Release with the VST3 and the Standalone app ready to download.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar
        run: cmake -B build -DSDC_COPY_PLUGIN=OFF

      - name: Compilar
        run: cmake --build build --config Release --target SalirDeCasa_All --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $out = "SalirDeCasa-windows"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse "build/SalirDeCasa_artefacts/Release/VST3/Salir de Casa.vst3" $out
          Copy-Item "build/SalirDeCasa_artefacts/Release/Standalone/Salir de Casa.exe" $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SalirDeCasa-windows
          path: SalirDeCasa-windows.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SalirDeCasa-windows.zip
          generate_release_notes: true
